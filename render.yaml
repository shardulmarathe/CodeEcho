# CodeEcho backend — Render Blueprint (Docker, free tier)
# Secrets marked sync: false — set in Render Dashboard or via MCP, never commit values.
services:
  - type: web
    name: codeecho-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_BASE_URL
        value: https://api.llm.stanford.edu
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-2.5-flash
      - key: API_BUDGET_CAP_USD
        value: "3.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: audio
      - key: CLERK_ISSUER
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENABLE_DEBUG_ROUTES
        value: "false"
      # Free tier is 512MB RAM. Local ONNX models OOM the process during scoring.
      # LLM scorecards still work; RAG coaching blocks are skipped until you add
      # EMBEDDING_API_KEY set in dashboard — Google gemini-embedding-001 (768-dim, no local ONNX).
      - key: RAG_ENABLED
        value: "true"
      - key: RERANK_ENABLED
        value: "false"
      # Optional: set EMBEDDING_API_KEY (Google) to avoid loading the local
      # fastembed model (~300MB). Vectors stay 768-dim (gemini-embedding-001).
      - key: EMBEDDING_API_KEY
        sync: false
