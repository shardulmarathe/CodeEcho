# CodeEcho backend — Render Blueprint (Docker, free tier)
# Secrets marked sync: false — set in Render Dashboard or via MCP, never commit values.
services:
  - type: web
    name: codeecho-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_BASE_URL
        value: https://api.llm.stanford.edu
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-2.5-pro
      - key: API_BUDGET_CAP_USD
        value: "3.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: audio
      - key: CLERK_ISSUER
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENABLE_DEBUG_ROUTES
        value: "false"
      # Free tier is 512MB RAM. Local ONNX models OOM the process during scoring.
      # LLM scorecards still work; RAG coaching blocks are skipped until you add
      # Cloud embeddings (Azure or Google) avoid loading local ONNX (~300MB) on free tier.
      - key: RAG_ENABLED
        value: "true"
      - key: RERANK_ENABLED
        value: "false"
      # Azure OpenAI (preferred): AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY,
      # AZURE_OPENAI_EMBEDDING_DEPLOYMENT=text-embedding-3-small
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: text-embedding-3-small
      # Google fallback: EMBEDDING_API_KEY (gemini-embedding-001, 768-dim)
      - key: EMBEDDING_API_KEY
        sync: false
