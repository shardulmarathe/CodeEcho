# CodeEcho backend — Render Blueprint (Docker, free tier)
# Secrets marked sync: false — set in Render Dashboard or via MCP, never commit values.
services:
  - type: web
    name: codeecho-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_BASE_URL
        value: https://api.llm.stanford.edu
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_SCORING_MODEL
        value: gemini-2.5-pro
      # Azure Whisper (preferred STT) — when set, transcription uses Whisper with
      # word-level timestamps instead of Gemini. Endpoint/key fall back to the
      # AZURE_OPENAI_* embedding creds below. Leave the deployment blank to disable.
      - key: AZURE_OPENAI_WHISPER_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_WHISPER_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_WHISPER_API_KEY
        sync: false
      - key: AZURE_OPENAI_WHISPER_API_VERSION
        value: "2024-06-01"
      - key: API_BUDGET_CAP_USD
        value: "3.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: audio
      - key: CLERK_ISSUER
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENABLE_DEBUG_ROUTES
        value: "false"
      # Free tier = 512MB RAM. Keep RERANK_ENABLED=false here: the cross-encoder loads
      # ~150-200MB of ONNX at runtime and OOMs during scoring. Hybrid pgvector + keyword
      # retrieval still runs; only the rerank pass is skipped. Enable locally instead.
      - key: RAG_ENABLED
        value: "true"
      - key: RERANK_ENABLED
        value: "false"
      # Azure OpenAI (preferred): AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY,
      # AZURE_OPENAI_EMBEDDING_DEPLOYMENT=text-embedding-3-small
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: text-embedding-3-small
      # Google fallback: EMBEDDING_API_KEY (gemini-embedding-001, 768-dim)
      - key: EMBEDDING_API_KEY
        sync: false
